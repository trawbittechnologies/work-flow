<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg-flash" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#cc3300"/>
      <stop offset="100%" stop-color="#660000"/>
    </radialGradient>
    <radialGradient id="face-flash" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0c8a0"/>
      <stop offset="100%" stop-color="#d49060"/>
    </radialGradient>
    <filter id="speed-blur">
      <feGaussianBlur stdDeviation="3" result="blur" in="SourceGraphic" stdDeviationX="4" stdDeviationY="0"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="yellow-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="58" fill="#1a0000" stroke="#f5c800" stroke-width="3"/>
  <!-- Speed force background lines -->
  <line x1="0" y1="40" x2="50" y2="55" stroke="#f5c800" stroke-width="1.5" opacity="0.3" filter="url(#speed-blur)"/>
  <line x1="0" y1="55" x2="40" y2="60" stroke="#f5c800" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="70" x2="50" y2="65" stroke="#f5c800" stroke-width="1.5" opacity="0.3" filter="url(#speed-blur)"/>
  <!-- Body suit -->
  <path d="M30 90 Q60 80 90 90 L95 120 L25 120Z" fill="#cc2200"/>
  <!-- Lightning bolt on chest -->
  <path d="M54 72 L62 60 L58 62 L66 50 L58 66 L62 64Z" fill="#f5c800" filter="url(#yellow-glow)"/>
  <!-- Mask -->
  <ellipse cx="60" cy="52" rx="30" ry="34" fill="url(#bg-flash)"/>
  <!-- Ear wings (Flash lightning fins) -->
  <path d="M30 50 Q22 44 20 55 Q24 48 30 52Z" fill="#f5c800" filter="url(#yellow-glow)"/>
  <path d="M90 50 Q98 44 100 55 Q96 48 90 52Z" fill="#f5c800" filter="url(#yellow-glow)"/>
  <!-- Face visible area below brow -->
  <ellipse cx="60" cy="58" rx="22" ry="18" fill="url(#face-flash)"/>
  <!-- Mask brow/top -->
  <path d="M38 48 Q60 34 82 48 Q78 38 60 36 Q42 38 38 48Z" fill="#cc2200"/>
  <!-- Eye cutouts white lenses -->
  <ellipse cx="47" cy="52" rx="10" ry="8" fill="#ffeeaa" transform="rotate(-8 47 52)"/>
  <ellipse cx="73" cy="52" rx="10" ry="8" fill="#ffeeaa" transform="rotate(8 73 52)"/>
  <!-- Lightning bolt pupils -->
  <path d="M45 49 L49 52 L46 52 L50 56 L44 53 L47 53Z" fill="#cc3300"/>
  <path d="M71 49 L75 52 L72 52 L76 56 L70 53 L73 53Z" fill="#cc3300"/>
  <!-- Eye glow -->
  <ellipse cx="47" cy="52" rx="8" ry="6" fill="none" stroke="#f5c800" stroke-width="0.8" transform="rotate(-8 47 52)" opacity="0.5" filter="url(#yellow-glow)"/>
  <ellipse cx="73" cy="52" rx="8" ry="6" fill="none" stroke="#f5c800" stroke-width="0.8" transform="rotate(8 73 52)" opacity="0.5" filter="url(#yellow-glow)"/>
  <!-- Mouth -->
  <path d="M50 66 Q60 72 70 66" stroke="#c4755a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Chin lightning bolt emblem on mask -->
  <path d="M57 76 L63 68 L59 70 L65 62 L59 74 L63 72Z" fill="#f5c800" opacity="0.6" transform="scale(0.5) translate(60 76)"/>
  <!-- Speed lines around head -->
  <line x1="90" y1="35" x2="120" y2="30" stroke="#f5c800" stroke-width="1" opacity="0.4" filter="url(#yellow-glow)"/>
  <line x1="92" y1="55" x2="120" y2="55" stroke="#f5c800" stroke-width="1.5" opacity="0.5" filter="url(#yellow-glow)"/>
  <line x1="90" y1="75" x2="120" y2="80" stroke="#f5c800" stroke-width="1" opacity="0.4" filter="url(#yellow-glow)"/>
</svg>
