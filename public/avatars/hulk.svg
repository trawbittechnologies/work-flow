  <line x1="56" y1="70" x2="56" y2="77" stroke="#0a5520" stroke-width="1.5"/>
  <line x1="64" y1="70" x2="64" y2="77" stroke="#0a5520" stroke-width="1.5"/>
  <line x1="70" y1="70" x2="70" y2="76" stroke="#0a5520" stroke-width="1.5"/>
  <!-- Ear -->
  <ellipse cx="32" cy="52" rx="6" ry="8" fill="url(#face-hulk)"/>
  <ellipse cx="88" cy="52" rx="6" ry="8" fill="url(#face-hulk)"/>
  <!-- Hair -->
  <path d="M34 40 Q40 22 60 20 Q80 22 86 40 Q75 30 60 28 Q45 30 34 40Z" fill="#0a3a10"/>
