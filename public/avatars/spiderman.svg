<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg-spider" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#cc1818"/>
      <stop offset="100%" stop-color="#7a0000"/>
    </radialGradient>
    <radialGradient id="eye-spider" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e0e8ff"/>
      <stop offset="100%" stop-color="#aabfff"/>
    </radialGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" fill="#1a0000" stroke="#cc1818" stroke-width="3"/>
  <!-- Face/mask base -->
  <ellipse cx="60" cy="65" rx="40" ry="44" fill="url(#bg-spider)"/>
  <!-- Web pattern lines -->
  <g stroke="#880000" stroke-width="0.8" fill="none" opacity="0.6">
    <line x1="60" y1="21" x2="60" y2="109"/>
    <line x1="20" y1="60" x2="100" y2="60"/>
    <line x1="32" y1="32" x2="88" y2="88"/>
    <line x1="88" y1="32" x2="32" y2="88"/>
    <ellipse cx="60" cy="65" rx="15" ry="15"/>
    <ellipse cx="60" cy="65" rx="25" ry="25"/>
    <ellipse cx="60" cy="65" rx="35" ry="35"/>
  </g>
  <!-- Blue sections -->
  <path d="M60 25 Q48 30 44 45 Q52 40 60 38 Q68 40 76 45 Q72 30 60 25Z" fill="#1a1aff" opacity="0.85"/>
  <path d="M20 75 Q25 95 40 100 Q45 85 44 70 Q35 72 20 75Z" fill="#1a1aff" opacity="0.85"/>
  <path d="M100 75 Q95 95 80 100 Q75 85 76 70 Q85 72 100 75Z" fill="#1a1aff" opacity="0.85"/>
  <!-- Eyes -->
  <ellipse cx="46" cy="55" rx="12" ry="9" fill="#fff" transform="rotate(-15 46 55)"/>
  <ellipse cx="74" cy="55" rx="12" ry="9" fill="#fff" transform="rotate(15 74 55)"/>
  <ellipse cx="46" cy="55" rx="10" ry="7" fill="url(#eye-spider)" transform="rotate(-15 46 55)" opacity="0.95"/>
  <ellipse cx="74" cy="55" rx="10" ry="7" fill="url(#eye-spider)" transform="rotate(15 74 55)" opacity="0.95"/>
  <!-- Eye shine -->
  <ellipse cx="42" cy="52" rx="3" ry="2" fill="white" opacity="0.5" transform="rotate(-15 42 52)"/>
  <ellipse cx="70" cy="52" rx="3" ry="2" fill="white" opacity="0.5" transform="rotate(15 70 52)"/>
